sonar.projectKey=AquaSecure
sonar.projectName=AquaSecure
sonar.projectDescription=Plateforme de gestion et de surveillance du réseau d'eau potable (Esprit 5TWIN4 — DevWave)
sonar.sourceEncoding=UTF-8

# Code analysé
sonar.sources=app,routes,config,database,resources/views,resources/js
sonar.tests=tests

# Exclusions : dépendances, fichiers générés, données de démonstration statiques
sonar.exclusions=vendor/**,node_modules/**,storage/**,bootstrap/cache/**,public/build/**,app/Data/PlaceholderData.php
# Les seeders et factories ne sont que des données de test : pas de règle de duplication dessus
sonar.cpd.exclusions=database/seeders/**,database/factories/**,resources/views/**

# Couverture de tests (rapport Clover produit par PHPUnit dans le CI)
sonar.php.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=database/**,config/**,routes/**,resources/**
