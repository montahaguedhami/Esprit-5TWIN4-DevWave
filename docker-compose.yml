# AquaSecure — environnement Docker
#
# Plateforme complète (application + MySQL + Mailpit) :
#   docker compose up -d --build                → http://localhost:8088   (e-mails : http://localhost:8025)
#   docker compose logs -f app                  (journaux : nginx, php-fpm, worker, planificateur)
#   docker compose down                         (les données restent dans les volumes ; -v pour tout effacer)
#
# APP_KEY et JWT_SECRET sont lus dans le fichier .env local (jamais copiés dans l'image).
#
# IA (Ollama) : par défaut l'application utilise l'Ollama installé sur la machine hôte.
#   Pour lancer Ollama en conteneur : OLLAMA_DOCKER_URL=http://ollama:11434 docker compose --profile ia up -d
#   puis : docker compose exec ollama ollama pull llama3.2
#
# Analyse de qualité (SonarQube) :
#   docker compose --profile qualite up -d      → http://localhost:9000
#   docker compose --profile qualite down

services:
  app:
    build:
      context: .
      args:
        WITH_DEMO_DATA: "true"
    image: aquasecure-app:local
    container_name: aquasecure-app
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_NAME: AquaSecure
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY manquant dans .env (php artisan key:generate)}
      APP_URL: http://localhost:${APP_PORT:-8088}
      APP_LOCALE: fr
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env (php artisan jwt:secret)}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${DOCKER_LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: aquasecure
      DB_USERNAME: aquasecure
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-aquasecure}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@aquasecure.tn
      MAIL_FROM_NAME: AquaSecure
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8088}:8080"
    volumes:
      - app_storage:/var/www/html/storage/app
    restart: unless-stopped

  mysql:
    image: mysql:8.0.46
    container_name: aquasecure-mysql
    environment:
      MYSQL_DATABASE: aquasecure
      MYSQL_USER: aquasecure
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-aquasecure}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 3307 côté hôte : 3306 est déjà pris par le MySQL de XAMPP
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: aquasecure-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.6
    profiles: ["ia"]
    container_name: aquasecure-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["qualite"]
    container_name: aquasecure-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Docker Desktop (WSL2) n'applique pas vm.max_map_count=262144 exigé par Elasticsearch :
      # contrôle désactivé, acceptable pour un serveur d'analyse local (pas en production)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    profiles: ["qualite"]
    container_name: aquasecure-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  ollama_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
