# AquaSecure — environnement Docker
#
# Analyse de qualité (SonarQube) :
#   docker compose --profile qualite up -d      → http://localhost:9000
#   docker compose --profile qualite down       (les données restent dans les volumes)
#
# Les services de l'application (app, mysql, ollama, mailpit) seront ajoutés à ce fichier.

services:
  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["qualite"]
    container_name: aquasecure-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Docker Desktop (WSL2) n'applique pas vm.max_map_count=262144 exigé par Elasticsearch :
      # contrôle désactivé, acceptable pour un serveur d'analyse local (pas en production)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    profiles: ["qualite"]
    container_name: aquasecure-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
