# AquaSecure — environnement Docker
#
# Plateforme complète (application + MySQL + Mailpit) :
#   docker compose up -d --build                → http://localhost:8088   (e-mails : http://localhost:8025)
#   docker compose logs -f app                  (journaux : nginx, php-fpm, worker, planificateur)
#   docker compose down                         (les données restent dans les volumes ; -v pour tout effacer)
#
# APP_KEY et JWT_SECRET sont lus dans le fichier .env local (jamais copiés dans l'image).
#
# IA (Ollama) : par défaut l'application utilise l'Ollama installé sur la machine hôte.
#   Pour lancer Ollama en conteneur : OLLAMA_DOCKER_URL=http://ollama:11434 docker compose --profile ia up -d
#   puis : docker compose exec ollama ollama pull llama3.2
#
# Analyse de qualité (SonarQube) :
#   docker compose --profile qualite up -d      → http://localhost:9000
#   docker compose --profile qualite down
#
# Supervision (Prometheus + Grafana) :
#   docker compose --profile supervision up -d  → Grafana http://localhost:3000 (admin / GRAFANA_ADMIN_PASSWORD, « admin » par défaut)
#                                                  Prometheus http://localhost:9090 (cibles : Status → Targets, alertes : Alerts)

services:
  app:
    build:
      context: .
      args:
        WITH_DEMO_DATA: "true"
    image: aquasecure-app:local
    container_name: aquasecure-app
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      APP_NAME: AquaSecure
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:?APP_KEY manquant dans .env (php artisan key:generate)}
      APP_URL: http://localhost:${APP_PORT:-8088}
      APP_LOCALE: fr
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant dans .env (php artisan jwt:secret)}
      LOG_CHANNEL: stderr
      LOG_LEVEL: ${DOCKER_LOG_LEVEL:-info}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: aquasecure
      DB_USERNAME: aquasecure
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-aquasecure}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: no-reply@aquasecure.tn
      MAIL_FROM_NAME: AquaSecure
      OLLAMA_URL: ${OLLAMA_DOCKER_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      # Assistants IA des incidents (Gemini) : clé lue dans le .env local, jamais copiée dans l'image
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-30}
      GEMINI_CACHE_MINUTES: ${GEMINI_CACHE_MINUTES:-360}
      # reCAPTCHA (connexion, inscription, mot de passe oublié) : clés lues dans le .env local ;
      # sans clé, la vérification est désactivée pour la démo locale
      RECAPTCHA_ENABLED: ${RECAPTCHA_ENABLED:-false}
      RECAPTCHA_VERSION: ${RECAPTCHA_VERSION:-v3}
      RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      RECAPTCHA_MIN_SCORE: ${RECAPTCHA_MIN_SCORE:-0.5}
      # Jeton de /metrics, partagé avec Prometheus (réseau Docker interne)
      METRICS_TOKEN: ${METRICS_TOKEN:-aquasecure-metrics-local}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_PORT:-8088}:8080"
    volumes:
      - app_storage:/var/www/html/storage/app
    restart: unless-stopped

  mysql:
    image: mysql:8.0.46
    container_name: aquasecure-mysql
    environment:
      MYSQL_DATABASE: aquasecure
      MYSQL_USER: aquasecure
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-aquasecure}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 3307 côté hôte : 3306 est déjà pris par le MySQL de XAMPP
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: aquasecure-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.6
    profiles: ["ia"]
    container_name: aquasecure-ollama
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # ── Supervision ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["supervision"]
    container_name: aquasecure-prometheus
    depends_on:
      app:
        condition: service_healthy
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-aquasecure-metrics-local}
    # Le jeton est écrit dans un fichier au démarrage (Prometheus ne lit pas les variables d'environnement)
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_TOKEN" > /prometheus/metrics_token &&
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=15d --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["supervision"]
    container_name: aquasecure-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aquasecure.json
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    profiles: ["supervision"]
    container_name: aquasecure-mysqld-exporter
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
    command: ["--mysqld.address=mysql:3306", "--mysqld.username=root"]
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.0
    profiles: ["supervision"]
    container_name: aquasecure-blackbox-exporter
    restart: unless-stopped

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    profiles: ["qualite"]
    container_name: aquasecure-sonarqube
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      # Docker Desktop (WSL2) n'applique pas vm.max_map_count=262144 exigé par Elasticsearch :
      # contrôle désactivé, acceptable pour un serveur d'analyse local (pas en production)
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  sonar-db:
    image: postgres:16-alpine
    profiles: ["qualite"]
    container_name: aquasecure-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  app_storage:
  mysql_data:
  ollama_data:
  prometheus_data:
  grafana_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db_data:
