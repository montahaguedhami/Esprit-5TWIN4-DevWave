; Réglages PHP de l'image AquaSecure
expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
max_execution_time = 120
date.timezone = Africa/Tunis

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Le code de l'image ne change pas : pas de vérification des dates de fichiers
opcache.validate_timestamps = 0
