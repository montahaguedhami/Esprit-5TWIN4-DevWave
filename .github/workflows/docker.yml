name: AquaSecure Docker

# Construit l'image de l'application, l'analyse avec Trivy, démarre la plateforme complète
# (docker compose) pour un test de fumée, puis publie l'image sur GHCR après un merge sur main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  LOCAL_TAG: aquasecure-app:local

jobs:
  image:
    name: Build, scan & smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.LOCAL_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Sécurité ----------------------------------------------------------
      - name: Trivy — vulnérabilités de l'image (HIGH/CRITICAL bloquantes)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln "$LOCAL_TAG"

      - name: Trivy — configuration du Dockerfile
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" "$TRIVY_IMAGE" \
            config --exit-code 1 --severity HIGH,CRITICAL /src/Dockerfile

      - name: Trivy — rapport SARIF (onglet Security)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$GITHUB_WORKSPACE:/out" "$TRIVY_IMAGE" \
            image --format sarif --output /out/trivy.sarif --severity MEDIUM,HIGH,CRITICAL --scanners vuln "$LOCAL_TAG"

      - name: Upload SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # --- Plateforme complète ------------------------------------------------
      - name: Start platform (docker compose)
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          JWT_SECRET="$(openssl rand -hex 32)"
          export APP_KEY JWT_SECRET
          docker compose up -d --no-build --wait --wait-timeout 300 app

      - name: Smoke test
        run: sh docker/smoke-test.sh

      - name: Platform logs
        if: failure()
        run: docker compose logs --no-color app mysql

      - name: Stop platform
        if: always()
        run: docker compose down -v

      # --- Publication (uniquement après merge sur main) -----------------------
      - name: Image metadata
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Log in to GHCR
        if: steps.meta.outcome == 'success'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
