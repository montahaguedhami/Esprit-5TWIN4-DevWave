
name: AquaSecure CI

on:
  push:
    branches:
      - main
      - fix-branch
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aquasecure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Laravel tests with MySQL
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aquasecure_test
          MYSQL_USER: aquasecure
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, bcmath, pdo_mysql, dom, fileinfo, xml, curl
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Prepare Laravel directories
        run: |
          mkdir -p storage/framework/cache/data
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p bootstrap/cache

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aquasecure_test
          DB_USERNAME: aquasecure
          DB_PASSWORD: test_password

      - name: Clear Laravel configuration cache
        run: php artisan config:clear
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aquasecure_test
          DB_USERNAME: aquasecure
          DB_PASSWORD: test_password

      - name: Run database migrations
        run: php artisan migrate:fresh --force
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aquasecure_test
          DB_USERNAME: aquasecure
          DB_PASSWORD: test_password

      - name: Run Laravel tests
        run: php artisan test
        env:
          APP_ENV: testing
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: aquasecure_test
          DB_USERNAME: aquasecure
          DB_PASSWORD: test_password

  frontend:
    name: Build frontend assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build
